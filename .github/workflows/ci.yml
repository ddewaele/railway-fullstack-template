name: CI

on:
  pull_request:
  # Required for the merge queue: GitHub runs CI on the queued merge commit.
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # The job name is the required status check in the `protect-main` ruleset.
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
      DATABASE_URL: postgres://app:app@localhost:5432/app_test
      SESSION_SECRET: ci-only-secret-never-used-in-production
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Runs the production entry point exactly as Railway does. Catches route-precedence bugs
      # (SPA fallback swallowing /api/*) and misconfiguration that unit tests cannot see.
      - name: Production smoke test
        env:
          NODE_ENV: production
          PORT: "3999"
        run: |
          node apps/server/dist/index.js > "$RUNNER_TEMP/smoke.log" 2>&1 & echo $! > "$RUNNER_TEMP/smoke.pid"
          for i in $(seq 1 30); do curl -sf localhost:3999/api/health >/dev/null && break; sleep 0.5; done
          curl -sf localhost:3999/api/health | grep -q '"db":"up"'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3999/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3999/some/client/route)" = 200
          curl -s localhost:3999/api/does-not-exist | grep -q '"error":"Not found"'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3999/api/auth/google)" = 503
          grep -q "OAuth redirect URI: $APP_URL/api/auth/google/callback" "$RUNNER_TEMP/smoke.log"
          kill "$(cat "$RUNNER_TEMP/smoke.pid")"

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/*.png
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
