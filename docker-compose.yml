# Local development database. Production uses Railway's managed Postgres.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      # Host port 5433 avoids clashing with a local Postgres or other projects.
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
